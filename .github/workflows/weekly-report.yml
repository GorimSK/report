name: Weekly marketing report

on:
  schedule:
    - cron: "0 5 * * 1"  # pondelok 05:00 UTC (7:00 v lete / 6:00 v zime SK)
  workflow_dispatch:
    inputs:
      period:
        description: "Obdobie reportu"
        default: last_week
        type: choice
        options: [yesterday, last_7_days, last_30_days, last_week, mtd, last_month]

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REPORT_CONFIG: ${{ secrets.REPORT_CONFIG }}
        run: |
          printf '%s' "$REPORT_CONFIG" > config.json
          python agent.py --period "${{ inputs.period || 'last_week' }}" --write-sheet --out reports/report.md
          cat reports/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/report.md
